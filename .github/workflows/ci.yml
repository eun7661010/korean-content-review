name: 공개 패키지 검증

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 텍스트 검사 의존성
        run: pip install kiwipiepy pytest
      - name: 텍스트 엔진 테스트 (외부 서비스 요청 없음)
        run: pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright와 Chromium
        run: |
          npm i -D playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: 한국어 렌더 도우미 자체 시험
        run: node skills/korean-line-break/scripts/ko-nobreak.mjs --selftest
      - name: React Native 감사 함수 자체 시험
        run: node skills/korean-line-break/scripts/rn-ko-lines.mjs --selftest
      - name: 줄바꿈 픽스처 회귀 검사
        run: node --test tests/linebreak_fixture.test.mjs
      - name: 플러그인 JSON 확인
        run: python -c "import json; json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); json.load(open('.claude-plugin/marketplace.json', encoding='utf-8'))"
      - name: 공개 금지 정보 검사
        run: python tools/scan_private.py
